# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Windows-ROOT makes the JVM validate TLS against the Windows certificate store
# instead of the JDK's own bundled cacerts. Required on this machine: Norton
# Antivirus intercepts TLS and re-signs every HTTPS response with its local root
# ("Norton Web/Mail Shield Root"). Windows trusts that root — which is why curl,
# npm and Chrome all work — but the JDK ships an independent truststore that does
# not, so every Gradle/Maven download failed with "PKIX path building failed:
# unable to find valid certification path". This reads the OS trust store rather
# than importing a CA into the JDK, so nothing outside this project changes.
#
# Windows-only by nature. This project is only ever built on a developer machine
# (never in the Docker/Nixpacks web deploy), so that is not a portability
# problem — but drop this line if the APK is ever built on Linux/CI.
org.gradle.jvmargs=-Xmx1536m -Djavax.net.ssl.trustStoreType=Windows-ROOT
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
android.useAndroidX=true
