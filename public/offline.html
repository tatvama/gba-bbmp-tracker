<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No connection · GBA Tracker</title>
    <!--
      Served by public/sw.js when a navigation request fails with the network
      down. Deliberately a plain static file, not a Next route: the whole point
      is that it is already cached and needs no server, and precaching a
      Next-rendered page would mean caching HTML/RSC, which is exactly what
      sw.js refuses to do (it would stale the live-update guarantee).

      Everything is inline for the same reason — one cached file, no extra
      requests that would themselves fail offline.
    -->
    <style>
      :root {
        --brand: #1e40af;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --fg: #f1f5f9;
          --muted: #94a3b8;
          --border: #1e293b;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .card { width: 100%; max-width: 26rem; text-align: center; }
      .mark {
        width: 64px; height: 64px;
        margin: 0 auto 1.5rem;
        border-radius: 16px;
        background: var(--brand);
        color: #fff;
        font-size: 23px;
        font-weight: 900;
        letter-spacing: -0.03em;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.375rem; font-weight: 650; }
      p { margin: 0 0 1.75rem; color: var(--muted); font-size: 0.9375rem; }
      button {
        width: 100%;
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 550;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
      .hint {
        margin: 1.5rem 0 0;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">GBA</div>
      <h1>You're offline</h1>
      <p>
        This page needs a connection. Your ward, complaint and RTI data lives on
        the server, so nothing loads until you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="hint">
        Check mobile data or Wi-Fi, then tap Try again. Anything you had already
        submitted was saved on the server.
      </p>
    </main>
    <script>
      // Reload the moment connectivity returns, so the user doesn't have to
      // notice and tap. 'online' can fire slightly before routing settles, so
      // give it a short beat.
      addEventListener("online", function () {
        setTimeout(function () {
          location.reload();
        }, 600);
      });
    </script>
  </body>
</html>
